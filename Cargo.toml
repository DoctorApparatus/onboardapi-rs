[package]
name = "rmodel-types"
version = "0.1.0"
edition = "2021"
description = "Rust types generated from Rheinmetall onboardapi IDL sources by tidl2rust."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
strum = { version = "0.26", features = ["derive"] }
typed-builder = "0.18"
