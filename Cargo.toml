[workspace]
resolver = "2"
members = ["crates/onboardapi-codegen", "crates/onboardapi-sys", "crates/onboardapi"]

[workspace.package]
version = "9.10.0"
edition = "2024"
license = "EPL-2.0"
# Must match the repository that publishes; the release workflow checks it.
repository = "https://github.com/DoctorApparatus/onboardapi-rs"
# typed-builder-macro 0.23 uses let-chains (stable since 1.88) without declaring it.
rust-version = "1.88"
keywords = ["onboardapi", "dds", "cyclonedds", "middleware", "ffi"]
categories = ["api-bindings", "network-programming", "simulation"]

[workspace.dependencies]
onboardapi-sys = { path = "crates/onboardapi-sys", version = "9.10.0" }

anyhow = "1"
async-trait = "0.1"
cc = { version = "1", features = ["parallel"] }
clap = { version = "4", features = ["derive", "env"] }
dotenv = "0.15"
heck = "0.5"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
typed-builder = "0.23"
